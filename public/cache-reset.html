<!doctype html>
<html lang="ru">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>KNOTTY PINE — восстановление игры</title>
 <style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;
   background:#1b050b;color:#f4e7db;font:17px/1.5 system-ui,Arial,sans-serif}
  main{width:min(92vw,520px);padding:25px;background:#30131e;border-radius:14px}
  button,a{font:inherit}button{cursor:pointer;background:#b59ae5;color:#1b050b;
   border:0;padding:13px 20px;border-radius:8px;font-weight:700}
  a{color:#d4c5fa}
 </style>
</head>
<body><main>
 <h1>Восстановить KNOTTY PINE</h1>
 <p>Удалит только старый офлайн-кэш игры и её прежний Service Worker.
 Сохранённые рекорды и настройки не удаляются.</p>
 <button id="reset">Очистить кэш и открыть игру</button>
 <p id="message" role="status"></p>
 <p><a href="./">Вернуться без очистки</a></p>
</main>
<script>
document.getElementById('reset').addEventListener('click',async()=>{
 const button=document.getElementById('reset');
 const status=document.getElementById('message');
 button.disabled=true;
 status.textContent='Удаляю старый кэш...';
 try{
  if('serviceWorker' in navigator){
   const registrations=await navigator.serviceWorker.getRegistrations();
   for(const registration of registrations){
    if(new URL(registration.scope).origin===location.origin)
     await registration.unregister();
   }
  }
  if('caches' in window){
   for(const key of await caches.keys()){
    if(key.startsWith('knotty-pine-offline-'))await caches.delete(key);
   }
  }
  status.textContent='Готово! Открываю восстановленную версию...';
  location.replace('./?restored=oct30');
 }catch(error){
  status.textContent='Не удалось очистить кэш: '+error.message;
  button.disabled=false;
 }
});
</script>
</body></html>
