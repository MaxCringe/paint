name: Verify Vite build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run gameplay regression tests
        run: npm test
      - name: Build production site
        run: npm run build
      - name: Check build output
        run: test -s dist/index.html

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and software-WebGL system libraries
        run: npx playwright install --with-deps chromium
      - name: Build Vite production site
        run: npm run build
      - name: Browser smoke test (ordinary and 3D Fiona runs)
        run: npm run test:browser
      - name: Upload failing browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
