name: Install selected Birds Wings CC0 clip
on:
  push:
    paths:
      - .github/workflows/locate-birds-wings.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c5 # v4.2.2
        with:
          persist-credentials: true
      - name: Download selected CC0 recording from Freesound
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://cdn.freesound.org/previews/432/432639_7414526-hq.mp3'
          curl --fail --location --silent --show-error --retry 3 "$SOURCE" --output /tmp/birds-wings-original.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/birds-wings-original.mp3
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/birds-wings-original.mp3)"
          python3 - "$DURATION" <<'PY'
          import sys
          duration=float(sys.argv[1])
          if not (14.0 < duration < 15.5):
            raise SystemExit('Freesound preview is not the expected 14.9 second recording')
          PY
          mkdir -p public/audio/sfx
          ffmpeg -hide_banner -loglevel error -y -i /tmp/birds-wings-original.mp3 -t 5.0 -af 'highpass=f=80,lowpass=f=7000,afade=t=in:st=0:d=0.08,afade=t=out:st=3.85:d=1.15,loudnorm=I=-15:TP=-1:LRA=7' -c:a libmp3lame -q:a 3 public/audio/sfx/bats-flock-digpro120.mp3
          file public/audio/sfx/bats-flock-digpro120.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/audio/sfx/bats-flock-digpro120.mp3
      - name: Commit the selected recording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/sfx/bats-flock-digpro120.mp3
          if ! git diff --staged --quiet; then
            git commit -m 'Add selected DigPro120 CC0 flock wings recording for bats'
            git push origin HEAD:main
          fi
