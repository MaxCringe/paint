name: Locate CC0 Birds Wings recording
on:
  push:
    paths:
      - .github/workflows/locate-birds-wings.yml
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Freesound and Pixabay public previews (no authentication)
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          targets=[
            'https://freesound.org/people/DigPro120/sounds/432639/',
            'https://pixabay.com/sound-effects/nature-birds-wings-68087/'
          ]
          for url in targets:
            print('CHECK',url,flush=True)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; KNOTTY-PINE-Sound-Check/1.0)'})
            try:
              with urllib.request.urlopen(req, timeout=16) as r:
                body=r.read(2500000).decode('utf-8','replace')
                print('STATUS',r.status,'SIZE',len(body),'TITLE_MATCH', 'Birds Wings' in body,'AUTHOR_MATCH','DigPro120' in body,flush=True)
                urls=re.findall(r'https?[^"\\\\\s<>]+?(?:\\.mp3|\\.ogg)(?:\\?[^"\\\\\s<>]*)?',body,re.I)
                urls=list(dict.fromkeys(html.unescape(x).replace('\\/','/') for x in urls))
                for media in urls[:10]:print('MEDIA',media[:450],flush=True)
                print('PIXABAY_CDN',body.find('cdn.pixabay.com/audio'),'FREESOUND_CDN',body.find('cdn.freesound.org/previews'),flush=True)
            except Exception as e:print('ERROR',type(e).__name__,str(e)[:300],flush=True)
          PY
