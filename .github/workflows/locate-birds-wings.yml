name: Install selected Birds Wings CC0 clip
on:
  push:
    paths:
      - .github/workflows/locate-birds-wings.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download selected CC0 recording from Freesound
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://cdn.freesound.org/previews/432/432639_7414526-hq.mp3'
          curl --fail --location --silent --show-error --retry 3 "$SOURCE" --output /tmp/birds-wings-original.mp3
          mkdir -p public/audio/sfx
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/birds-wings-original.mp3').read_bytes()
          if not (60000 < len(raw) < 1000000):
            raise SystemExit(f'Unexpected Freesound preview size: {len(raw)}')
          if not (raw.startswith(b'ID3') or raw[0] == 255):
            raise SystemExit('Not an MP3 preview: ' + raw[:20].hex())
          target=Path('public/audio/sfx/bats-flock-digpro120.mp3')
          target.write_bytes(raw)
          print('Imported verified MP3 bytes:',len(raw))
          PY
      - name: Commit the selected recording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/sfx/bats-flock-digpro120.mp3
          if ! git diff --staged --quiet; then
            git commit -m 'Add selected DigPro120 CC0 flock wings recording for bats'
            git push origin HEAD:main
          fi
