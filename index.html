<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KNOTTY PINE — Fiona in Hell | 29.10</title>
<link rel="stylesheet" href="/src/styles/game.css">

</head>
<body>
<div id="hud">
 <div id="top">
  <div id="record-group">
   <div class="pill"><span class="small">РЕКОРД МЕТРОВ</span><span class="big" id="best">0 m</span></div>
   <div class="pill"><span class="small">РЕКОРД ДУШ</span><span class="big" id="best-souls">0</span></div>
  </div>
  <div id="distance-soul-group">
   <div class="pill" id="distance-pill" style="text-align:right"><span class="small">ПУТЬ ИЗ АДА</span><span class="big" id="distance">0 m</span></div>
   <div class="pill stat-pill" style="text-align:right"><span class="small">ДУШИ</span><span class="big" id="coins">0</span></div>
   <div id="soul-meter-wrap" aria-label="Шкала ульты">
    <div id="soul-meter-label"><span id="soul-state">ПЛАМЯ ДУШ</span><span id="soul-count">0/100</span></div>
    <div id="soul-meter"><div id="soul-fill"></div></div>
   </div>
  </div>
 </div>
 <div id="audio-controls" aria-label="Настройки музыки и звуков игры">
  <div class="audio-control-row">
   <button id="sound-toggle" type="button" title="Включить или выключить игровые звуки" aria-label="Выключить игровые звуки">🔊</button>
   <input id="sound-volume" type="range" min="0" max="100" step="1" value="35" aria-label="Громкость эффектов">
   <span id="sound-volume-value">35%</span>
  </div>
  <div class="audio-control-row">
   <button id="music-toggle" type="button" title="Включить или выключить музыку" aria-label="Выключить музыку">🎵</button>
   <span class="audio-row-label">МУЗЫКА</span>
   <input id="music-volume" type="range" min="0" max="100" step="1" value="30" aria-label="Громкость музыки">
   <span id="music-volume-value">30%</span>
  </div>
 </div>
 <div id="toast">+ COIN</div>
 <section id="center">
  <h1>KNOTTY<br><em>PINE</em></h1>
  <p class="desc" id="message">Фиона Гуд — ведьма в аду. Уклоняйся от сучковатых сосен, прыгай через корни и переживи этот кошмар.</p>
  <button id="start">СПУСТИТЬСЯ В АД</button>
  <div id="hint">← → СМЕНА ПОЛОСЫ &nbsp; • &nbsp; ↑ ×2 ДВОЙНОЙ ПРЫЖОК &nbsp; • &nbsp; ↓ ПОДКАТ<br>СОБЕРИ 100 ДУШ — УЛЬТА-ПОЛЁТ С АУРОЙ</div>
 </section>
 <div id="bottom">
  <button class="ctrl" id="left" aria-label="Влево">←</button><button class="ctrl" id="jump" aria-label="Прыжок; нажмите дважды для двойного прыжка">↑</button><button class="ctrl" id="slide" aria-label="Подкат">↓</button><button class="ctrl" id="right" aria-label="Вправо">→</button>
 </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
